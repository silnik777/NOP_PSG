name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest

      - name: Generate SBOM (permissive-license check — W11.2)
        run: |
          # Scope the SBOM to the installed project distribution (not the ambient
          # environment) so only real project dependencies are audited.
          cyclonedx-py environment --output-format json --outfile sbom.json
          python - <<'PY'
          import json, sys
          data = json.load(open("sbom.json"))
          bad = []
          for c in data.get("components", []):
              for lic in c.get("licenses", []):
                  name = str((lic.get("license") or {}).get("id")
                             or (lic.get("license") or {}).get("name", "")
                             or lic.get("expression", "")).upper()
                  if ("GPL" in name or "AGPL" in name) and "LGPL" not in name:
                      bad.append((c.get("name"), name))
          if bad:
              print("Copyleft (GPL/AGPL) dependencies detected — violates W11.2:")
              for n, lic in bad:
                  print(f"  - {n}: {lic}")
              sys.exit(1)
          print("SBOM OK: no GPL/AGPL copyleft dependencies.")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
